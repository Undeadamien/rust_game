[package]
name = "rust_game"
version = "0.1.0"
description = "An example generated using the event-driven template"
authors = ["Undeadamien <damien.trala@outlook.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
